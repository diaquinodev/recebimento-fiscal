[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recebimento-fiscal"
version = "0.1.0"
description = "Recebimento fiscal com 3-way match (pedido × recebimento × NF-e), SOAP, OCR de DANFE e agente de exceções"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7",
  "lxml>=5.2",
  "sqlalchemy>=2.0",
  "fastapi>=0.111",
  "uvicorn>=0.30",
  "httpx>=0.27",
  "fpdf2>=2.7",
  "pypdf>=4.0",
  "streamlit>=1.35",
  "pypdfium2>=4.30",
  "pillow>=10.3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
  "mypy>=1.10",
  "lxml-stubs",
  "zeep>=4.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
# Texto em português usa caracteres que o ruff confunde com ASCII (acentos, travessão).
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["fpdf.*", "pypdf.*", "pypdfium2.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
